name: release

# Pushing a tag like v0.1.0 tests Ferry, builds it once, and publishes that build to PyPI after
# approval in the `pypi` environment. PyPI trusted publishing means no token is stored: register this
# repository, release.yml and the `pypi` environment as a trusted publisher of sigmoid-ferry first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The tag matches pyproject.toml
        run: test "v$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" = "$GITHUB_REF_NAME"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      # Without tool.uv.sources, as pip and uv build it from PyPI.
      - run: uv build --no-sources
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # Trusted Publishing: no stored token
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv publish

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Ferry ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
